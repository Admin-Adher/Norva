<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b12">
  <title>Norva Auth Prototype E — Quiet access</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="prototype.css">
</head>
<body class="variant-e" data-variant="e" data-mode="signup" data-p-density="1">
  <main class="auth-stage">
    <div class="bare-shell">
      <section class="bare-story" aria-labelledby="e-title">
        <a class="brand-lockup" href="index.html" aria-label="Back to Norva auth proposals">
          <img src="https://norva.tv/img/norva-app-icon.png" alt="">
          <span>Norva</span>
        </a>
        <p class="eyebrow">Account access</p>
        <h1 id="e-title">Sign in. Your screens remember the rest.</h1>
        <p>No carousel, no tutorial and no visual container around every sentence. The account action owns the page.</p>
        <div class="screen-presence" aria-label="Available on"><span>Phone</span><span>Web</span><span>Android TV</span></div>
      </section>
      <section class="bare-form" aria-label="Norva account access">
        <div class="auth-panel" data-auth-render data-prefix="e" data-signup-intro="One account for Norva on phone, web and TV." data-signin-intro="Sign in and continue on the screen you choose."></div>
      </section>
    </div>
  </main>
  <script src="prototype.js"></script>
</body>
</html>
