<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06080d">
  <title>Norva Auth Prototype D — Immersive drawer</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="prototype.css">
</head>
<body class="variant-d" data-variant="d" data-mode="signup" data-p-density="1">
  <main class="auth-stage">
    <div class="immersive-shell">
      <section class="immersive-scene" aria-labelledby="d-title">
        <img class="immersive-backdrop" src="https://norva.tv/assets/landing/norva-every-screen-premium.webp" alt="">
        <a class="brand-lockup" href="index.html" aria-label="Back to Norva auth proposals">
          <img src="https://norva.tv/img/norva-app-icon.png" alt="">
          <span>Norva</span>
        </a>
        <div class="immersive-copy">
          <p class="eyebrow">Your account is the handoff</p>
          <h1 id="d-title">Pick up on any screen.</h1>
          <p>Phone, web and Android TV share the same profiles, favorites and playback progress — without an auto-playing pitch above the form.</p>
        </div>
      </section>
      <section class="auth-drawer" aria-label="Norva account access">
        <div class="auth-panel" data-auth-render data-prefix="d" data-signup-intro="Create the account first. Connect your compatible source after sign-up." data-signin-intro="Your screens and profiles are waiting for you."></div>
      </section>
    </div>
  </main>
  <script src="prototype.js"></script>
</body>
</html>
