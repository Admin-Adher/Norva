plugins {
    id "com.android.application"
}

// Release signing is supplied by CI via env (see .github/workflows/android-release.yml).
// Absent locally and for debug builds, the release type stays unsigned and the
// debug build is completely unaffected.
def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_FILE")
def hasReleaseKeystore = releaseKeystorePath != null && new File(releaseKeystorePath).exists()

android {
    namespace "tv.norva.tv"
    compileSdk 36

    defaultConfig {
        applicationId "tv.norva.tv"
        minSdk 23
        targetSdk 36
        versionCode 28
        versionName "3.8.15-hybrid"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Public routing configuration for the dedicated Android TV project.
        // Operators can still override it for an isolated build when needed.
        buildConfigField "String", "CLARITY_PROJECT_ID", "\"${project.findProperty('CLARITY_PROJECT_ID') ?: 'y9fxs54jpc'}\""
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            assets.srcDirs = ["src/main/assets"]
            java.srcDir "../../android-common/src/main/java"
        }
        test {
            java.srcDir "../../android-common/src/test/java"
        }
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // R8 left off for the first release so the bundled WebView assets and
            // media3 reflection paths are never stripped.
            minifyEnabled false
            // Signed only when CI supplies a keystore via env (debug unaffected).
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

def norvaPublicDir = file("../../../public")
def norvaAssetsDir = file("src/main/assets/www")

tasks.register("syncNorvaWebAssets", Sync) {
    from(norvaPublicDir)
    into(norvaAssetsDir)
    exclude("screenshots/**")
    // Web-only pages that never belong in the offline app bundle:
    // landing.html (marketing, already 301'd to / on the web and superseded by
    // index.html's native redirect) and probe.html (browser diagnostic). Neither
    // is reachable from the app shell.
    exclude("landing.html")
    exclude("probe.html")
}

preBuild.dependsOn("syncNorvaWebAssets")

dependencies {
    // Standalone-mode native player (full track selection, MKV/EAC3/HEVC).
    implementation "androidx.media3:media3-exoplayer:1.5.1"
    implementation "androidx.media3:media3-exoplayer-hls:1.5.1"
    // SubtitleView is used even though the remote-first controls stay custom:
    // it preserves WebVTT/SSA positioning, styling and bitmap cues that a
    // plain TextView cannot render faithfully.
    implementation "androidx.media3:media3-ui:1.5.1"
    // MediaSession: Google Assistant voice transport ("pause", "reprends") and
    // the Android TV now-playing card drive the player.
    implementation "androidx.media3:media3-session:1.5.1"
    // Watch Next ("Play Next") row on the Android TV home screen.
    // 1.1.0 exposes the Watch Next builder contract as public API.
    implementation "androidx.tvprovider:tvprovider:1.1.0"
    implementation "androidx.webkit:webkit:1.12.1"
    implementation "com.microsoft.clarity:clarity:3.8.3"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    testImplementation "junit:junit:4.13.2"
}
