name: Auto-publish Norva Blog

# Publishes blog articles when their scheduled slot arrives.
#
# Source of truth lives in content/blog/ (drafts + publication-calendar.csv +
# published-state.json). scripts/blog/build-blog.js renders every article whose
# slot has passed into public/blog/<slug>/index.html, rebuilds the blog index
# and sitemap, records the real first-publication instant, then this workflow
# commits the result to main and deploys it to Cloudflare Pages.
#
# The build is idempotent: a run with no newly-due article commits nothing and
# skips the deploy. Scheduled runs only start once this file is on the default
# branch (main).

on:
  workflow_dispatch:
    inputs:
      min_published:
        description: 'Minimum number of articles to keep live (floor)'
        required: false
        default: '4'
  schedule:
    # Run once shortly after each 06:00 and 20:00 editorial slot. GitHub applies
    # Europe/Paris daylight-saving changes, so no duplicate UTC fallback run is
    # needed in either the morning or the evening.
    - cron: '5 6,20 * * *'
      timezone: 'Europe/Paris'

concurrency:
  group: blog-autopublish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish due articles
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
          persist-credentials: true

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.22.3'

      - name: Install locked test dependencies
        run: npm ci --ignore-scripts

      - name: Validate the full corpus renders cleanly
        run: npm run blog:validate

      - name: Publish any due articles (render pages, index, sitemap, state)
        env:
          BLOG_MIN_PUBLISHED: ${{ github.event.inputs.min_published || '4' }}
        run: npm run blog:build

      - name: Run the complete regression suite before committing
        run: npm test

      - name: Commit newly published pages to main
        id: commit
        run: |
          git config user.name "norva-blog-bot"
          git config user.email "bot@norva.tv"
          git add public/blog public/sitemap-blog.xml content/blog/published-state.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            echo "No newly-due articles — nothing to publish this run."
          else
            git commit -m "chore(blog): auto-publish scheduled article(s) [skip ci]"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Validate and deploy the exact blog commit
    needs: publish
    if: needs.publish.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: Cloudflare
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.publish.outputs.commit_sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.22.3'

      - name: Install locked test dependencies
        run: npm ci --ignore-scripts

      - name: Run regression suite on the exact deployment commit
        run: npm test

      - name: Verify region model
        run: npm run verify:region

      - name: Check frontend JavaScript syntax
        run: |
          node --check public/js/api.js
          node --check public/js/cloudApi.js
          node --check public/js/pages/WatchPage.js
          node --check public/js/norvaEngine.js

      - name: Compile and verify Cloudflare Pages Functions
        shell: bash
        run: |
          set -euo pipefail
          functions_build="$(mktemp -d)"
          trap 'rm -rf -- "$functions_build"' EXIT
          test "$(npx --no-install wrangler --version)" = "4.102.0"
          npx --no-install wrangler pages functions build functions \
            --outdir "$functions_build/bundle" \
            --output-routes-path "$functions_build/routes.json"
          test -s "$functions_build/bundle/index.js"
          node - "$functions_build/routes.json" "$functions_build/bundle/index.js" <<'NODE'
          const fs = require('node:fs');
          const routes = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const bundle = fs.readFileSync(process.argv[3], 'utf8');
          if (
            !Array.isArray(routes.include)
            || !routes.include.includes('/partners-kyc-return')
            || !bundle.includes('routePath: "/partners-kyc-return"')
          ) {
            throw new Error('Didit callback is missing from the Pages Functions bundle');
          }
          NODE

      - name: Minify landing CSS
        run: npm run minify:css

      - name: Cache-bust assets by content hash
        run: npm run hash:assets

      - name: Inline landing CSS into entry HTML
        run: npm run inline:css

      - name: Deploy public/ to Cloudflare Pages (norva-web)
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.102.0'
          command: pages deploy public --project-name=norva-web --branch=main
