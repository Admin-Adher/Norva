name: Isolated Android player device QA
on:
  workflow_dispatch:
  push:
    branches: ['codex/native-mpeg4-software-decode-20261004']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      - name: Build isolated phone player and instrumentation
        working-directory: clients/android-phone
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest -PnorvaPlayerDeviceQa=true --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-player-device-qa
          path: |
            clients/android-phone/app/build/outputs/apk/debug/*.apk
            clients/android-phone/app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 7
