name: Android emulator QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-emulator-qa.yml'
      - 'scripts/qa/run-android-emulator-tests.sh'
      - 'clients/android-phone/**'
      - 'clients/android-tv/**'
      - 'clients/android-common/**'

permissions:
  contents: read

jobs:
  phone:
    name: Phone API 35 (${{ matrix.navigation }}, font ${{ matrix.font_scale }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        navigation: [three-button, gesture]
        font_scale: ['1.0', '1.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented phone tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash scripts/qa/run-android-emulator-tests.sh phone ${{ matrix.navigation }} ${{ matrix.font_scale }}
      - name: Upload phone test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-emulator-${{ matrix.navigation }}-font-${{ matrix.font_scale }}
          path: clients/android-phone/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14

  tv:
    name: Android TV API 34 (font ${{ matrix.font_scale }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        font_scale: ['1.0', '1.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented TV tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash scripts/qa/run-android-emulator-tests.sh tv ${{ matrix.font_scale }}
      - name: Upload TV test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-emulator-font-${{ matrix.font_scale }}
          path: clients/android-tv/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
