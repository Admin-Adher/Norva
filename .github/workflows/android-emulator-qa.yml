name: Android emulator QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-emulator-qa.yml'
      - 'scripts/qa/run-android-emulator-tests.sh'
      - 'scripts/qa/patch-emulator-runner-unlock.cjs'
      - 'tests/emulator-runner-unlock.test.js'
      - 'clients/android-phone/**'
      - 'clients/android-tv/**'
      - 'clients/android-common/**'

permissions:
  contents: read

jobs:
  phone:
    name: Phone API 35 (${{ matrix.navigation }}, font ${{ matrix.font_scale }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        navigation: [three-button, gesture]
        font_scale: ['1.0', '1.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install phone compile SDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"
      # Compile before boot so Gradle does not compete with first-start setup of
      # the launcher and keyboard. The connected test task still runs below.
      - name: Compile phone and instrumentation APKs before emulator boot
        working-directory: clients/android-phone
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Keep the upstream Apache-2.0 action and its licence intact. Apply only
      # the audited unlock correction; see scripts/qa/android-emulator-runner-patch.md.
      - name: Check out pinned phone emulator runner
        uses: actions/checkout@v4
        with:
          repository: ReactiveCircus/android-emulator-runner
          ref: a421e43855164a8197daf9d8d40fe71c6996bb0d
          path: .github/actions/phone-emulator-runner
          persist-credentials: false
      - name: Apply focus-safe emulator unlock
        run: node scripts/qa/patch-emulator-runner-unlock.cjs .github/actions/phone-emulator-runner
      - name: Run instrumented phone tests
        uses: ./.github/actions/phone-emulator-runner
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash scripts/qa/run-android-emulator-tests.sh phone ${{ matrix.navigation }} ${{ matrix.font_scale }}
      - name: Upload phone test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-emulator-${{ matrix.navigation }}-font-${{ matrix.font_scale }}
          path: clients/android-phone/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14

  tv:
    name: Android TV API 34 (font ${{ matrix.font_scale }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        font_scale: ['1.0', '1.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented TV tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash scripts/qa/run-android-emulator-tests.sh tv ${{ matrix.font_scale }}
      - name: Upload TV test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-emulator-font-${{ matrix.font_scale }}
          path: clients/android-tv/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
