name: Offsite DB backup to R2

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offsite-db-backup-r2
  cancel-in-progress: false

jobs:
  backup:
    name: Read-only logical backup
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Dump on Hetzner and upload to R2
        uses: appleboy/ssh-action@v1.2.2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        with:
          host: 157.180.96.159
          username: adrien
          key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          script_stop: true
          envs: R2_ACCOUNT_ID,R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY,R2_BUCKET,BACKUP_AGE_RECIPIENT
          script: |
            set -euo pipefail
            cd /home/adrien/norva
            git pull --ff-only
            export R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET BACKUP_AGE_RECIPIENT
            export BACKUP_ENCRYPTION_REQUIRED=true
            export R2_PREFIX=db
            bash ops/hetzner/scripts/19-backup-db-to-r2.sh
