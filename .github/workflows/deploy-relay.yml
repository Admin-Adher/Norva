name: Deploy Norva Relay Worker

# The relay Worker (services/norva-relay) carries playback through Cloudflare's
# residential-friendly edge and now rewrites open-ended seek ranges into bounded
# ones so browser Resume is instant. The web routes playback through it, so it
# redeploys alongside the Pages site on every push to main (kept in its own
# workflow so a Workers-permission issue never masks the web deploy status).

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: relay
        type: choice
        options:
          - relay
          - media-cache-canary
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.target == 'relay'
    name: Deploy norva-relay to Cloudflare Workers
    runs-on: ubuntu-latest
    environment: Cloudflare
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.22.3'

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.102.0'
          workingDirectory: services/norva-relay
          command: deploy

  media-cache-canary:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'media-cache-canary'
    name: Isolated private media-cache canary
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: norva-media-cache-canary
      cancel-in-progress: false
    environment: Cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MEDIA_CACHE_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MEDIA_CACHE_CANARY_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_MEDIA_CACHE_PURGE_TOKEN }}
      MEDIA_CACHE_CANARY_BASE_URL: https://media-cache-canary.norva.tv
      MEDIA_CACHE_CANARY_EXPECT_HOST: media-cache-canary.norva.tv
      MEDIA_CACHE_CANARY_REQUIRE_GLOBAL_PURGE: 'true'
      MEDIA_CACHE_CANARY_RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
      MEDIA_CACHE_CANARY_BUCKET_CREATED: 'false'
      MEDIA_CACHE_CANARY_WORKER_ATTEMPTED: 'false'
      MEDIA_CACHE_CANARY_READY: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.22.3'

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Verify canary contracts before provisioning
        run: |
          set -euo pipefail
          test "$(npx --no-install wrangler --version)" = "4.102.0"
          node --check ops/cloudflare/media-cache-canary-client.mjs
          node --test tests/media-cache-worker-e2e.test.js tests/watch-private-media-cache.test.js tests/media-cache-cloudflare-canary-contract.test.js
          npx --no-install wrangler deploy --config workers/media-cache/wrangler.canary.toml --dry-run

      - name: Create ephemeral canary credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$MEDIA_CACHE_CANARY_PURGE_TOKEN"
          service_token="$(openssl rand -hex 32)"
          manifest_key="$(openssl rand -hex 32)"
          ticket_key="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$service_token" "$manifest_key" "$ticket_key"
          {
            printf 'MEDIA_CACHE_CANARY_SERVICE_TOKEN=%s\n' "$service_token"
            printf 'MEDIA_CACHE_CANARY_MANIFEST_HMAC_KEY=%s\n' "$manifest_key"
            printf 'MEDIA_CACHE_CANARY_TICKET_HMAC_KEY=%s\n' "$ticket_key"
          } >> "$GITHUB_ENV"

      - name: Resolve the exact Norva zone
        shell: bash
        run: |
          set -euo pipefail
          zone_response="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones?name=norva.tv&status=active")"
          zone_id="$(printf '%s' "$zone_response" | node -e '
            let raw = "";
            process.stdin.on("data", (chunk) => { raw += chunk; });
            process.stdin.on("end", () => {
              const payload = JSON.parse(raw);
              if (payload.success !== true || !Array.isArray(payload.result) || payload.result.length !== 1) process.exit(2);
              const zone = payload.result[0];
              if (zone.name !== "norva.tv" || zone.account?.id !== process.env.CLOUDFLARE_ACCOUNT_ID || !/^[0-9a-f]{32}$/.test(zone.id)) process.exit(3);
              process.stdout.write(zone.id);
            });
          ')"
          printf '::add-mask::%s\n' "$zone_id"
          printf 'MEDIA_CACHE_CANARY_ZONE_ID=%s\n' "$zone_id" >> "$GITHUB_ENV"

      - name: Provision isolated Worker and R2 bucket
        shell: bash
        run: |
          set -euo pipefail
          if npx --no-install wrangler r2 bucket info norva-media-cache-canary --json >/dev/null 2>&1; then
            echo 'Refusing to reuse a pre-existing canary R2 bucket.' >&2
            exit 1
          fi
          npx --no-install wrangler r2 bucket create norva-media-cache-canary
          printf 'MEDIA_CACHE_CANARY_BUCKET_CREATED=true\n' >> "$GITHUB_ENV"
          printf 'MEDIA_CACHE_CANARY_WORKER_ATTEMPTED=true\n' >> "$GITHUB_ENV"
          npx --no-install wrangler deploy --config workers/media-cache/wrangler.canary.toml
          node -e '
            process.stdout.write(JSON.stringify({
              MEDIA_CACHE_GATEWAY_TOKEN: process.env.MEDIA_CACHE_CANARY_SERVICE_TOKEN,
              MEDIA_CACHE_MANIFEST_HMAC_KEY: process.env.MEDIA_CACHE_CANARY_MANIFEST_HMAC_KEY,
              MEDIA_CACHE_TICKET_HMAC_KEY: process.env.MEDIA_CACHE_CANARY_TICKET_HMAC_KEY,
              MEDIA_CACHE_CLOUDFLARE_ZONE_ID: process.env.MEDIA_CACHE_CANARY_ZONE_ID,
              MEDIA_CACHE_CLOUDFLARE_PURGE_TOKEN: process.env.MEDIA_CACHE_CANARY_PURGE_TOKEN,
            }));
          ' | npx --no-install wrangler secret bulk --config workers/media-cache/wrangler.canary.toml
          npx --no-install wrangler deploy --config workers/media-cache/wrangler.canary.toml
          printf 'MEDIA_CACHE_CANARY_READY=true\n' >> "$GITHUB_ENV"

      - name: Prove private R2, CDN hit, global purge and recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node ops/cloudflare/media-cache-canary-client.mjs | tee artifacts/media-cache-canary-receipt.json

      - name: Remove all canary data and Cloudflare resources
        if: always()
        shell: bash
        env:
          MEDIA_CACHE_CANARY_CLEANUP_ONLY: 'true'
          MEDIA_CACHE_CANARY_HEALTH_ATTEMPTS: '6'
        run: |
          set -uo pipefail
          cleanup_status=0
          if [ "$MEDIA_CACHE_CANARY_READY" = 'true' ]; then
            node ops/cloudflare/media-cache-canary-client.mjs || cleanup_status=$?
          else
            echo 'Skipping object cleanup because the configured Worker never became ready.'
          fi
          delete_worker_status=0
          if [ "$MEDIA_CACHE_CANARY_WORKER_ATTEMPTED" = 'true' ]; then
            worker_delete_log="$(mktemp)"
            if ! npx --no-install wrangler delete norva-media-cache-canary --force >"$worker_delete_log" 2>&1; then
              if ! grep -Fq '[code: 10090]' "$worker_delete_log"; then
                cat "$worker_delete_log" >&2
                delete_worker_status=1
              fi
            fi
            rm -f -- "$worker_delete_log"
          fi
          delete_bucket_status=0
          if [ "$MEDIA_CACHE_CANARY_BUCKET_CREATED" = 'true' ]; then
            npx --no-install wrangler r2 bucket delete norva-media-cache-canary || delete_bucket_status=$?
            if npx --no-install wrangler r2 bucket info norva-media-cache-canary --json >/dev/null 2>&1; then
              echo 'Canary R2 bucket still exists after cleanup.' >&2
              delete_bucket_status=1
            fi
          fi
          if [ "$cleanup_status" -ne 0 ] || [ "$delete_worker_status" -ne 0 ] || [ "$delete_bucket_status" -ne 0 ]; then
            echo "Canary cleanup failed: object=$cleanup_status worker=$delete_worker_status bucket=$delete_bucket_status" >&2
            exit 1
          fi

      - name: Upload secret-free canary receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: media-cache-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/media-cache-canary-receipt.json
          if-no-files-found: ignore
          retention-days: 14
