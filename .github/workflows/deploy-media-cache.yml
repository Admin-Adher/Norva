name: Deploy Norva Private Media Cache

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_PRIVATE_MEDIA_CACHE to deploy the persistent production Worker and bucket
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY_PRIVATE_MEDIA_CACHE'
    name: Deploy private media-cache Worker and R2 binding
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: norva-media-cache-production
      cancel-in-progress: false
    environment: Cloudflare
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MEDIA_CACHE_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      MEDIA_CACHE_PRODUCTION_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_MEDIA_CACHE_PURGE_TOKEN }}
      MEDIA_CACHE_PRODUCTION_SERVICE_TOKEN: ${{ secrets.NORVA_MEDIA_CACHE_WORKER_TOKEN }}
      MEDIA_CACHE_PRODUCTION_MANIFEST_HMAC_KEY: ${{ secrets.NORVA_MEDIA_CACHE_MANIFEST_HMAC_KEY }}
      MEDIA_CACHE_PRODUCTION_TICKET_HMAC_KEY: ${{ secrets.NORVA_MEDIA_CACHE_TICKET_HMAC_KEY }}
      MEDIA_CACHE_PRODUCTION_BASE_URL: https://media-cache.norva.tv
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.22.3'

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts

      - name: Verify immutable production inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(npx --no-install wrangler --version)" = "4.102.0"
          test "$GITHUB_REF" = 'refs/heads/main'
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_ZONE_ID"
          node -e '
            const values = [
              process.env.MEDIA_CACHE_PRODUCTION_SERVICE_TOKEN,
              process.env.MEDIA_CACHE_PRODUCTION_MANIFEST_HMAC_KEY,
              process.env.MEDIA_CACHE_PRODUCTION_TICKET_HMAC_KEY,
              process.env.MEDIA_CACHE_PRODUCTION_PURGE_TOKEN,
            ];
            if (!/^[A-Za-z0-9_-]{32,256}$/.test(values[0] || "")) process.exit(2);
            if (!/^[0-9a-f]{64}$/.test(values[1] || "")) process.exit(3);
            if (!/^[0-9a-f]{64}$/.test(values[2] || "")) process.exit(4);
            if (!/^[A-Za-z0-9_-]{32,256}$/.test(values[3] || "")) process.exit(5);
            if (new Set(values).size !== values.length) process.exit(6);
          '
          zone_response="$(curl --silent --show-error \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID")"
          printf '%s' "$zone_response" | node -e '
            let raw = "";
            process.stdin.on("data", (chunk) => { raw += chunk; });
            process.stdin.on("end", () => {
              const payload = JSON.parse(raw);
              const zone = payload.result;
              if (payload.success !== true || !zone || Array.isArray(zone)
                || zone.id !== process.env.CLOUDFLARE_ZONE_ID
                || zone.name !== "norva.tv" || zone.status !== "active"
                || zone.account?.id !== process.env.CLOUDFLARE_ACCOUNT_ID) process.exit(7);
            });
          '
          node --test tests/media-cache-worker-e2e.test.js tests/media-cache-cloudflare-canary-contract.test.js tests/media-cache-cloudflare-production-deploy-contract.test.js
          npx --no-install wrangler deploy --config workers/media-cache/wrangler.toml --dry-run

      - name: Ensure the persistent private R2 bucket exists
        shell: bash
        run: |
          set -euo pipefail
          if npx --no-install wrangler r2 bucket info norva-media-cache --json >/dev/null 2>&1; then
            echo 'Persistent production bucket already exists.'
          else
            npx --no-install wrangler r2 bucket create norva-media-cache
          fi

      - name: Deploy code, dedicated secrets and custom domain
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install wrangler deploy --config workers/media-cache/wrangler.toml
          node -e '
            process.stdout.write(JSON.stringify({
              MEDIA_CACHE_GATEWAY_TOKEN: process.env.MEDIA_CACHE_PRODUCTION_SERVICE_TOKEN,
              MEDIA_CACHE_MANIFEST_HMAC_KEY: process.env.MEDIA_CACHE_PRODUCTION_MANIFEST_HMAC_KEY,
              MEDIA_CACHE_TICKET_HMAC_KEY: process.env.MEDIA_CACHE_PRODUCTION_TICKET_HMAC_KEY,
              MEDIA_CACHE_CLOUDFLARE_ZONE_ID: process.env.CLOUDFLARE_ZONE_ID,
              MEDIA_CACHE_CLOUDFLARE_PURGE_TOKEN: process.env.MEDIA_CACHE_PRODUCTION_PURGE_TOKEN,
            }));
          ' | npx --no-install wrangler secret bulk --config workers/media-cache/wrangler.toml
          npx --no-install wrangler deploy --config workers/media-cache/wrangler.toml

      - name: Verify private production health
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node --input-type=module <<'NODE' | tee artifacts/media-cache-production-receipt.json
          const base = process.env.MEDIA_CACHE_PRODUCTION_BASE_URL;
          let health;
          for (let attempt = 0; attempt < 20; attempt += 1) {
            try {
              const response = await fetch(`${base}/health`, { redirect: "error" });
              if (response.ok) health = await response.json();
              if (health?.ok === true) break;
            } catch (_) {}
            await new Promise((resolve) => setTimeout(resolve, 1_500));
          }
          if (!health || health.service !== "norva-media-cache" || health.protocol !== 1
            || health.objectStoreConfigured !== true || health.gatewayAuthConfigured !== true
            || health.manifestAuthConfigured !== true || health.ticketAuthConfigured !== true
            || health.sharedEdgeCacheConfigured !== true || health.globalEdgePurgeConfigured !== true) {
            throw new Error("Production media-cache health contract failed");
          }
          const anonymous = await fetch(`${base}/v1/hls/${"0".repeat(64)}/playlist.m3u8`, {
            redirect: "error",
          });
          await anonymous.body?.cancel();
          if (anonymous.status !== 401) throw new Error("Anonymous media-cache request was not denied");
          process.stdout.write(`${JSON.stringify({
            ok: true,
            protocol: 1,
            host: new URL(base).hostname,
            revision: process.env.GITHUB_SHA,
            privateR2: true,
            anonymousDenied: true,
            globalPurgeConfigured: true,
          })}\n`);
          NODE

      - name: Upload secret-free production receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: media-cache-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/media-cache-production-receipt.json
          if-no-files-found: ignore
          retention-days: 30
