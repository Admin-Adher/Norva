      - '.github/workflows/deploy-cloudflare.yml'
      - '.github/workflows/deploy-relay.yml'
      - '.github/workflows/backup-db-to-r2.yml'
      - 'supabase/functions/deno.partners.json'
      - 'supabase/functions/deno.partners.lock'
      - 'public/app.html'
      - 'public/sw.js'
      - 'public/partners-terms.html'
      - 'public/privacy.html'
      - 'public/terms.html'
      - 'public/js/app.js'
      - 'public/js/cloudApi.js'
      - 'public/js/pages/AdminPage.js'
      - 'public/js/pages/PartnersPage.js'
      - 'public/js/pages/Settings.js'
      - 'public/js/utils/standalone.js'
      - 'public/css/main.css'
      - 'clients/android-phone/**'
      - 'clients/android-tv/**'
