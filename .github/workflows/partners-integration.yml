      - 'supabase/functions/norva-admin/**'
      - 'supabase/functions/norva-account-delete/**'
      - 'supabase/functions/norva-billing-webhook/**'
      - 'supabase/functions/norva-partners/**'
      - 'supabase/functions/norva-partners-device/**'
      - 'supabase/functions/norva-partners-kyc-webhook/**'
      - 'supabase/functions/norva-partners-revolut-payout/**'
      - 'supabase/functions/norva-partners-referral/**'
      - 'supabase/functions/norva-partners-worker/**'
      - 'supabase/functions/norva-revenuecat-transfer-worker/**'
      - 'supabase/functions/norva-revolut-billing/**'
      - 'supabase/functions/norva-revolut-webhook/**'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
