permissions:
  contents: read

concurrency:
  group: partners-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-edge:
    name: Contracts and Edge type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        # actions/setup-node v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts

      - name: Run Partners contract tests
        run: >-
          node --test
          tests/admin-norva-partners.test.js
          tests/norva-partners-*.test.js
          tests/google-play-orders-partners.test.js
          tests/android-phone-partners-contract.test.js

      - name: Validate Partners backup and parity shell syntax
        run: >-
          bash -n
          ops/hetzner/backup/backup-nightly.sh
          ops/hetzner/backup/rehearse-partners-physical.sh
          ops/hetzner/scripts/01-dump-prod.sh
          ops/hetzner/scripts/05-verify-parity.sh
          ops/hetzner/scripts/capture-norva-partners-didit-live-config-evidence.sh
          ops/hetzner/scripts/check-norva-partners-pilot-preactivation.sh

      - name: Validate the fail-closed pilot evidence template
        run: >-
          node scripts/validate-partners-release-evidence.js
          ops/partners/pilot-release.example.json

      - name: Validate the separate fail-closed financial canary template
        run: >-
          node scripts/validate-partners-financial-canary-evidence.js
          ops/partners/financial-canary-evidence.example.json

      - name: Validate the fail-closed approval evidence template
        run: >-
          node scripts/validate-partners-approval-evidence.js
          ops/partners/approval-evidence.example.json

      - name: Run financial producer non-regression tests
        run: >-
          node --test
          tests/revenuecat-billing-contract.test.js
          tests/revenuecat-email-producers.test.js
          tests/revolut-billing-cycle-idempotency.test.js
          tests/revolut-checkout-reliability.test.js
          tests/revolut-monotonic-projection.test.js
          tests/payment-terminal-reconciliation.test.js
          tests/internal-account-billing-invariant.test.js

      - name: Set up Deno
        # denoland/setup-deno v2.0.5
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.4

      - name: Type-check the Partners Edge boundary
        run: >-
          deno check
          --config supabase/functions/deno.partners.json
          --frozen
          supabase/functions/norva-partners/index.ts
          supabase/functions/norva-partners-device/index.ts
          supabase/functions/norva-partners-didit-purge-worker/index.ts
          supabase/functions/norva-partners-kyc-webhook/index.ts
          supabase/functions/norva-partners-revolut-payout/index.ts
          supabase/functions/norva-partners-referral/index.ts
          supabase/functions/norva-partners-worker/index.ts
          supabase/functions/norva-revenuecat-transfer-worker/index.ts
          supabase/functions/norva-admin/index.ts
          supabase/functions/norva-account-delete/index.ts
          supabase/functions/norva-billing-webhook/index.ts
          supabase/functions/norva-revolut-webhook/index.ts
          supabase/functions/norva-revolut-billing/index.ts

      - name: Test the Didit Partners boundary
        run: >-
          deno test
          --config supabase/functions/deno.partners.json
          --frozen
          supabase/functions/_shared/didit-partners.test.ts
          supabase/functions/_shared/didit-purge-worker.test.ts

  android-contracts:
    name: Android ${{ matrix.label }} compile and tests
    needs: contracts-and-edge
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Phone
            project: clients/android-phone
          - label: TV
            project: clients/android-tv

    steps:
      - name: Check out repository
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up JDK 17
        # actions/setup-java v4
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        # android-actions/setup-android v4
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699
        with:
          packages: ''

      - name: Install Android API 36 SDK
        run: >-
          sdkmanager
          "platform-tools"
          "platforms;android-36"
          "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        # gradle/actions/setup-gradle v4
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests, lint and compile
        working-directory: ${{ matrix.project }}
        run: >-
          gradle
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleDebug
          --no-daemon
          --stacktrace

  browser-e2e:
    name: Mocked Web and mobile journey
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js
        # actions/setup-node v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Install locked application dependencies
        run: npm ci --ignore-scripts

      - name: Install the pinned Playwright runner
        run: >-
          npm install
          --no-save
          --ignore-scripts
          --package-lock=false
          @playwright/test@1.62.0

      - name: Install Chromium and runner libraries
        run: npx playwright install --with-deps chromium

      - name: Run the Partners browser journey
        run: npx playwright test --config=tests/e2e/playwright.config.js

  disposable-database:
    name: Disposable Supabase database
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js for the Supabase action
        # actions/setup-node v6.5.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22.22.3'

      - name: Set up the pinned Supabase CLI
        # supabase/setup-cli v3.0.0
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.110.0

      - name: Stage the Partners migration prefix
        shell: bash
        run: |
          set -euo pipefail
          phase123_dir="$RUNNER_TEMP/phase123-online-migrations"
          mkdir -p "$phase123_dir"
          mapfile -t phase123_migrations < <(
            find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' |
              sort |
              awk '$0 >= "20260822220000_cloud_sources_owner_index_online.sql"'
          )
          test "${#phase123_migrations[@]}" -gt 0
          test "${phase123_migrations[0]}" = \
            '20260822220000_cloud_sources_owner_index_online.sql'
          printf '%s\n' "${phase123_migrations[@]}" > \
            "$phase123_dir/manifest.txt"
          for migration in "${phase123_migrations[@]}"; do
            mv "supabase/migrations/$migration" "$phase123_dir/$migration"
          done
          test ! -e \
            supabase/migrations/20260822220000_cloud_sources_owner_index_online.sql
          test -e \
            "$phase123_dir/20260824100000_catalog_cache_epoch_v2.sql"

      - name: Start a fresh database-only Supabase container
        run: supabase db start

      - name: Replay the complete Partners migration prefix from a blank database
        run: supabase db reset --local --no-seed

      - name: Verify restored Partners security invariants
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t db_containers < <(
            docker ps --format '{{.Names}}' | grep '^supabase_db_'
          )
          if [[ "${#db_containers[@]}" -ne 1 ]]; then
            printf 'Expected one disposable Supabase DB, found %s\n' \
              "${#db_containers[@]}" >&2
            exit 1
          fi
          docker exec -i "${db_containers[0]}" \
            psql -X -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < ops/hetzner/backup/verify-partners-restore.sql

      - name: Run exhaustive Partners pgTAP tests on the fresh database
        run: >-
          supabase test db
          supabase/tests/affiliate_p0.sql
          supabase/tests/affiliate_access_requests.sql
          supabase/tests/affiliate_didit_certification_pre_gate.sql
          supabase/tests/affiliate_dispute_won.sql
          supabase/tests/affiliate_fiscal_payout_onboarding.sql
          supabase/tests/affiliate_frictionless_membership_credits.sql
          supabase/tests/affiliate_referral_visibility.sql
          supabase/tests/affiliate_member_write_rate_limits.sql
          supabase/tests/affiliate_kyc_reverification_override.sql
          supabase/tests/affiliate_revolut_manual_hybrid.sql
          supabase/tests/revenuecat_transfer.sql
          --local

      - name: Run the data-compatible physical restore contract
        run: >-
          supabase test db
          supabase/tests/affiliate_restore_compatibility.sql
          --local

      - name: Lint public and private Partners routines
        run: >-
          supabase db lint
          --local
          --schema public,affiliate_private
          --level warning
          --fail-on error

      - name: Fail on security advisor warnings
        run: >-
          supabase db advisors
          --local
          --type security
          --level warn
          --fail-on warn

      - name: Fail on performance advisor errors
        run: >-
          supabase db advisors
          --local
          --type performance
          --level error
          --fail-on error

      - name: Apply the focused Provider refresh migration graph
        shell: bash
        run: |
          set -euo pipefail
          phase123_dir="$RUNNER_TEMP/phase123-online-migrations"
          mapfile -t db_containers < <(
            docker ps --format '{{.Names}}' | grep '^supabase_db_'
          )
          if [[ "${#db_containers[@]}" -ne 1 ]]; then
            printf 'Expected one disposable Supabase DB, found %s\n' \
              "${#db_containers[@]}" >&2
            exit 1
          fi
          migrations=(
            20260822220703_provider_access_lifecycle_foundation.sql
            20260822220712_provider_source_lifecycle_triggers.sql
            20260824120000_provider_access_cycles_detection_v1.sql
            20260827033406_provider_auto_refresh_fair_claim_v1.sql
            20260827122100_provider_auto_refresh_claim_cooldown_v1.sql
            20260827143000_postgrest_application_conflict_sqlstate_v1.sql
          )
          for migration in "${migrations[@]}"; do
            test -f "$phase123_dir/$migration"
            docker exec -i "${db_containers[0]}" \
              psql -X -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
              < "$phase123_dir/$migration"
          done
          # Production has no Supabase migration ledger. Prove the guarded
          # forward migration is a safe no-op if a deploy loses its receipt
          # after PostgreSQL committed the transaction.
          docker exec -i "${db_containers[0]}" \
            psql -X -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            < "$phase123_dir/20260827143000_postgrest_application_conflict_sqlstate_v1.sql"
      - name: Run the Provider refresh PostgreSQL concurrency proof
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t db_containers < <(
            docker ps --format '{{.Names}}' | grep '^supabase_db_'
          )
          if [[ "${#db_containers[@]}" -ne 1 ]]; then
            printf 'Expected one disposable Supabase DB, found %s\n' \
              "${#db_containers[@]}" >&2
            exit 1
          fi
          tap_output="$RUNNER_TEMP/provider-auto-refresh-fair-claim.tap"
          if ! docker exec -i "${db_containers[0]}" \
              psql -X -qAt -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
              < supabase/tests/provider_auto_refresh_fair_claim.sql \
              > "$tap_output" 2>&1; then
            cat "$tap_output"
            exit 1
          fi
          cat "$tap_output"
          if grep -Eq '^(not ok|Bail out!)' "$tap_output"; then
            exit 1
          fi
          plan_line="$(grep -E '^1\.\.[0-9]+$' "$tap_output" | tail -n 1)"
          if [[ ! "$plan_line" =~ ^1\.\.[0-9]+$ ]]; then
            printf 'Missing pgTAP plan\n' >&2
            exit 1
          fi
          expected_tests="${plan_line#1..}"
          passed_tests="$(grep -Ec '^ok( |$)' "$tap_output" || true)"
          if [[ "$passed_tests" != "$expected_tests" ]]; then
            printf 'pgTAP count mismatch: %s/%s\n' \
              "$passed_tests" "$expected_tests" >&2
            exit 1
          fi

      - name: Prove application conflicts are non-retryable
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t db_containers < <(
            docker ps --format '{{.Names}}' | grep '^supabase_db_'
          )
          if [[ "${#db_containers[@]}" -ne 1 ]]; then
            printf 'Expected one disposable Supabase DB, found %s\n' \
              "${#db_containers[@]}" >&2
            exit 1
          fi
          tap_output="$RUNNER_TEMP/postgrest-application-conflict.tap"
          if ! docker exec -i "${db_containers[0]}" \
              psql -X -qAt -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
              < supabase/tests/postgrest_application_conflict_sqlstate.sql \
              > "$tap_output" 2>&1; then
            cat "$tap_output"
            exit 1
          fi
          cat "$tap_output"
          if grep -Eq '^(not ok|Bail out!)' "$tap_output"; then
            exit 1
          fi
          test "$(grep -Ec '^ok( |$)' "$tap_output" || true)" = '5'

      - name: Stop the disposable stack
        if: always()
        run: supabase stop --no-backup
