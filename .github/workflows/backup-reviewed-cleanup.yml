name: Reviewed legacy backup cleanup
on:
  workflow_dispatch:
    inputs:
      apply:
        description: Delete only the three reviewed September legacy objects
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: offsite-db-backup-r2
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install boto3==1.40.45
      - name: Inventory or apply reviewed allowlist
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          APPLY: ${{ inputs.apply }}
        run: |
          args=()
          if [[ "$APPLY" == true ]]; then args+=(--apply); fi
          python ops/backup/cleanup-reviewed-legacy-20261002.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy-backup-cleanup-manifest
          path: legacy-cleanup-manifest.json
          if-no-files-found: ignore
