name: Catalog modal Android QA
on:
  workflow_dispatch:
  push:
    branches: [codex/max-ott-import-ux]
    paths:
      - '.github/workflows/catalog-modal-android-qa.yml'
      - 'clients/android-phone/**'
      - 'tests/fixtures/catalog-progress-modal.html'
      - 'public/css/main.css'
      - 'public/js/components/SourceManager.js'
      - 'public/js/components/NorvaModal.js'
permissions:
  contents: read
jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        navigation: [threebutton, gestural]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: |
            adb shell settings put system font_scale 1.3
            adb shell cmd overlay enable --user 0 com.android.internal.systemui.navbar.${{ matrix.navigation }}
            cd clients/android-phone && gradle :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=tv.norva.phone.CatalogProgressModalInstrumentedTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-modal-${{ matrix.navigation }}
          path: clients/android-phone/app/build/outputs/androidTest-results/connected/
          retention-days: 14
