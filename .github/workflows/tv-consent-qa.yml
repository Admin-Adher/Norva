name: TV consent D-pad QA
on:
  push:
    branches: [codex/tv-cookie-consent]
  pull_request:
    paths:
      - 'public/js/consent-banner.js'
      - 'public/js/utils/tvNavigation.js'
      - 'clients/android-tv/app/src/androidTest/java/tv/norva/tv/ConsentDpadInstrumentedTest.java'
      - 'tests/fixtures/tv-consent.html'
      - '.github/workflows/tv-consent-qa.yml'
permissions:
  contents: read
jobs:
  tv:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        font_scale: ['1.0', '1.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          NORVA_ANDROID_TEST_CLASS: tv.norva.tv.ConsentDpadInstrumentedTest
        with:
          api-level: 34
          target: android-tv
          arch: x86
          profile: tv_1080p
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          script: bash scripts/qa/run-android-emulator-tests.sh tv ${{ matrix.font_scale }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-consent-font-${{ matrix.font_scale }}
          path: clients/android-tv/app/build/outputs/androidTest-results/connected/
          retention-days: 14
