events {}

http {
  access_log off;

  server {
    listen 8000;

    location = /health {
      return 204;
    }

    location /rest/v1/ {
      proxy_pass http://norva-phase123-rest-proof:3000/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto http;
    }
  }
}
