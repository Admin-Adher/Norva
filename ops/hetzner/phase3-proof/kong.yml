_format_version: '3.0'
_transform: true

consumers:
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY

acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

services:
  - name: phase3-proof-auth-open
    url: http://auth:9999/verify
    routes:
      - name: phase3-proof-auth-open
        strip_path: true
        paths: [/auth/v1/verify]
    plugins:
      - name: cors
  - name: phase3-proof-auth
    url: http://auth:9999/
    routes:
      - name: phase3-proof-auth
        strip_path: true
        paths: [/auth/v1/]
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          allow: [anon, admin]
  - name: phase3-proof-rest
    url: http://rest:3000/
    routes:
      - name: phase3-proof-rest
        strip_path: true
        paths: [/rest/v1/]
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          allow: [anon, admin]
  - name: phase3-proof-functions
    url: http://functions:9000/
    routes:
      - name: phase3-proof-functions
        strip_path: true
        paths: [/functions/v1/]
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          allow: [anon, admin]
  - name: phase3-proof-realtime
    url: http://realtime:4000/socket
    routes:
      - name: phase3-proof-realtime
        strip_path: true
        paths: [/realtime/v1/]
    plugins:
      - name: cors
