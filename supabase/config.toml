# Local CLI namespace only. Production is the self-hosted api.norva.tv stack;
# the deleted managed project reference must never be used as a deploy target.
project_id = "norva-self-host"

[functions.norva-cloud]
verify_jwt = false

[functions.norva-catalog]
verify_jwt = false

[functions.norva-playback]
verify_jwt = false

[functions.norva-source-sync]
verify_jwt = false

# Provider Access v1 validates browser JWTs in-function and also hosts a durable
# internal worker authenticated by the shared platform bearer plus a dedicated
# worker token. The platform JWT gate must therefore let both request classes
# reach the handler; every non-OPTIONS route still fails closed in-function.
[functions.norva-provider-access]
verify_jwt = false

# Service-gated (NORVA_BACKFILL_TOKEN, verified in-function) series-info pre-warm crawler,
# driven by pg_cron. Fills cloud_series_info_cache from the gateway's single stable IP so the
# web never makes a live provider call for series-info. See docs/SERIES-INFO-CACHE.md.
[functions.norva-series-prewarm]
verify_jwt = false

# Service-gated (NORVA_BACKFILL_TOKEN) backfill that fills catalog_titles.original_language from
# TMDB (source language, e.g. 'ja' for anime), so the player resolves a VOSTFR/VO "original"
# audio track to its real language. Hits TMDB only, never the IPTV provider.
[functions.norva-tmdb-origlang]
verify_jwt = false

# RevenueCat uses a shared Authorization value (not a Supabase JWT), so the
# platform gateway check is disabled. The function itself requires both
# NORVA_REVENUECAT_WEBHOOK_AUTH and the timestamped raw-body HMAC configured in
# NORVA_REVENUECAT_WEBHOOK_HMAC_SECRET; either missing/invalid fails closed.
[functions.norva-billing-webhook]
verify_jwt = false

# Cron-only RevenueCat TRANSFER replay and post-commit Partners outbox worker.
# The endpoint verifies NORVA_CRON_SHARED_SECRET in PostgreSQL before leasing.
[functions.norva-revenuecat-transfer-worker]
verify_jwt = false

# Supabase "Send Email Hook": called by the auth server (no user JWT) with a
# Standard-Webhooks signature, which the function verifies itself via
# SEND_EMAIL_HOOK_SECRET. Sends auth emails through Resend.
[functions.norva-auth-email]
verify_jwt = false

# Resend delivery events (at-least-once, out of order). The function verifies
# the Svix HMAC signature itself with RESEND_WEBHOOK_SECRET and writes an
# idempotent service-only delivery ledger.
[functions.norva-resend-webhook]
verify_jwt = false

# Import-lifecycle digest sender, driven by pg_cron with our shared cron secret
# in the Authorization header (not a Supabase JWT). The gateway JWT check is
# disabled so the request reaches the function, which verifies the secret itself
# via norva_verify_cron_secret (same pattern as the source-sync crons).
[functions.norva-import-notify]
verify_jwt = false

# Durable DB-originated security/trial email sender. The minutely pg_cron call
# carries NORVA_CRON_SHARED_SECRET and the function verifies it itself before
# leasing any immutable outbox row.
[functions.norva-branded-email-worker]
verify_jwt = false

# Provider Access reminder worker. PostgreSQL owns scheduling, independent
# email/push leases and final authorization; this endpoint accepts only the
# shared cron secret and leaves every channel disabled by default.
[functions.norva-provider-access-notify]
verify_jwt = false

# New-signup Telegram worker. PostgreSQL owns the durable outbox and wakes this
# endpoint with NORVA_CRON_SHARED_SECRET; the function verifies that secret itself.
[functions.norva-signup-notify]
verify_jwt = false

# Privileged admin actions on users (resend confirmation / change role / suspend).
# The gateway JWT check is disabled so the OPTIONS preflight and the request reach
# the function, which verifies the caller is an admin itself (getUser + app_metadata
# .role === 'admin') before using the service role to act.
[functions.norva-admin]
verify_jwt = false

# Admin-only MKV strategy laboratory. OPTIONS and requests reach the function,
# which revalidates the Supabase JWT and server-set app_metadata.role before
# forwarding only a fixed fixture enum to the private runner.
[functions.norva-admin-media-lab]
verify_jwt = false

# Lifecycle / billing emails cron (welcome always; trial J-2 reminder, dunning, win-back
# gated behind NORVA_LIFECYCLE_BILLING_LIVE). Cron-authenticated via norva_verify_cron_secret.
[functions.norva-lifecycle]
verify_jwt = false

# Revolut Merchant webhook — reconciles subscription/order events into the
# entitlement projection. No Supabase JWT (Revolut calls it); auth is the HMAC
# signature it verifies itself. INERT until REVOLUT_WEBHOOK_SIGNING_SECRET is set.
[functions.norva-revolut-webhook]
verify_jwt = false

# Revolut checkout — opens a trial-setup order, returns the RevolutCheckout widget
# token; /confirm finalizes without a webhook; /profile /cancel /resume for the
# manage UI. No Supabase JWT here (the function verifies the user JWT itself).
# INERT until REVOLUT_SECRET_KEY is set.
[functions.norva-revolut]
verify_jwt = false

# Revolut recurring-billing cron — the only place that charges a saved Revolut card
# (MIT). INERT until REVOLUT_SECRET_KEY is set. Cron-authenticated via
# norva_verify_cron_secret. Register the pg_cron job (see the file header).
[functions.norva-revolut-billing]
verify_jwt = false

# Self-service account deletion validates the user JWT in-function. Its durable
# confirmation outbox is also drained by a cron bearer that is verified through
# norva_verify_cron_secret, so requests must reach the function first.
[functions.norva-account-delete]
verify_jwt = false

# User/admin support routes validate their Supabase JWT in-function. The same
# endpoint also hosts a durable email worker authenticated by the shared cron
# secret, so the platform JWT gate must let both request classes reach it.
[functions.norva-support]
verify_jwt = false

# Norva Partners member API (bootstrap, application, terms/activation, links
# and dashboard). The gateway JWT check is disabled only so exact-allowlist
# OPTIONS preflights can reach the handler. Every non-OPTIONS request
# prevalidates the Supabase user JWT with verifyUserJwtLocally and confirms it
# through GoTrue;
# device/service tokens are never accepted by this user boundary.
[functions.norva-partners]
verify_jwt = false

# Didit calls this endpoint without a Supabase JWT. The handler verifies the
# exact raw-body HMAC and five-minute timestamp before accepting only the
# configured KYC application's status.updated events.
[functions.norva-partners-kyc-webhook]
verify_jwt = false

# Browser referral resolution is terminated by Cloudflare Pages. Only signed,
# short-lived server-to-server requests from that boundary may reach this
# service-role resolver; it is not a public anonymous API despite verify_jwt.
[functions.norva-partners-referral]
verify_jwt = false

# Paired Android TV devices authenticate with the existing opaque nv_dev_
# credential. The handler hashes it, requires a trusted non-revoked TV row and
# exposes only relay availability/create/status. It cannot call KYC, finance
# or attribution RPCs. User consumption stays on norva-partners.
[functions.norva-partners-device]
verify_jwt = false

# Partners financial queue worker. pg_cron sends NORVA_CRON_SHARED_SECRET to
# /cron/run; the function verifies it with norva_verify_cron_secret before any
# lease. Monetary arithmetic, J+45 eligibility and immutable ledger writes stay
# inside the database RPCs. No payout provider is called by this boundary.
[functions.norva-partners-worker]
verify_jwt = false

# Revolut Business Partners payout boundary. The Basic/manual statement route
# authenticates Finance users in-function. The future API cron verifies the
# shared cron secret and additionally requires BOTH the managed DB flag and
# NORVA_PARTNERS_REVOLUT_API_ENABLED=true; all API secrets default empty.
[functions.norva-partners-revolut-payout]
verify_jwt = false
