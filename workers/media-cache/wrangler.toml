name = "norva-media-cache"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[[r2_buckets]]
binding = "MEDIA_CACHE_BUCKET"
bucket_name = "norva-media-cache"

[vars]
MEDIA_CACHE_ALLOWED_ORIGINS = "https://norva.tv,https://app.norva.tv,https://norva-web.pages.dev,http://localhost:3000,http://localhost:5173,http://localhost:4173"

# Secrets are configured with `wrangler secret put` during the gated rollout:
# MEDIA_CACHE_GATEWAY_TOKEN
# MEDIA_CACHE_MANIFEST_HMAC_KEY (exactly 32 bytes encoded as 64 hex)
# MEDIA_CACHE_TICKET_HMAC_KEY (a different exact 32-byte key encoded as 64 hex)
# MEDIA_CACHE_CLOUDFLARE_ZONE_ID (the Norva custom-domain zone; required before cache reads)
# MEDIA_CACHE_CLOUDFLARE_PURGE_TOKEN (dedicated Cache Purge-only API token)
